name: Windows portable startup in runner context

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify release and check startup in runner context
        env:
          RELEASE_URL: https://github.com/Renanuya/tikir-pc/releases/download/v0.1.0/Tikir-PC-0.1.0-Portable-x64.exe
          EXPECTED_SHA256: 9a6052793b63e129c6c1516412b3edca6304ffd22b7e8b06f2b1040f06d123aa
        run: |
          $ErrorActionPreference = 'Stop'
          $workRoot = Join-Path $env:RUNNER_TEMP ('tikir-smoke-' + [guid]::NewGuid().ToString('N'))
          $reportPath = Join-Path $env:RUNNER_TEMP 'tikir-windows-smoke.json'
          $null = New-Item -ItemType Directory -Path $workRoot
          $tempRoot = Join-Path $workRoot 'portable-temp'
          $null = New-Item -ItemType Directory -Path $tempRoot
          $portable = Join-Path $workRoot 'Tikir-PC-0.1.0-Portable-x64.exe'
          $report = [ordered]@{
            passed = $false
            startedUtc = [DateTime]::UtcNow.ToString('o')
            expectedSha256 = $env:EXPECTED_SHA256
            actualSha256 = $null
            releaseUrl = $env:RELEASE_URL
            startupBudgetSeconds = 10
            mainWindow = $null
            tokenElevated = $null
            startupPassed = $false
            nonAdminVerified = $false
            testContext = 'GitHub-hosted runner account; no standard-user login is created'
            limits = 'Startup and read-only audio-device query only. No API key, API calls, repairs, or installer test. Token elevation is reported separately; this is not a standard-user session test.'
          }
          $launcher = $null
          $previousTemp = $env:TEMP
          $previousTmp = $env:TMP
          try {
            Invoke-WebRequest -Uri $env:RELEASE_URL -OutFile $portable -TimeoutSec 120
            $report.actualSha256 = (Get-FileHash -Path $portable -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($report.actualSha256 -ne $env:EXPECTED_SHA256) { throw 'Release hash mismatch; executable was not launched.' }
            Add-Type -TypeDefinition @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          public static class SmokeToken {
            [DllImport("kernel32.dll", SetLastError=true)] static extern IntPtr OpenProcess(uint rights, bool inherit, int pid);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool OpenProcessToken(IntPtr process, uint access, out IntPtr token);
            [DllImport("advapi32.dll", SetLastError=true)] static extern bool GetTokenInformation(IntPtr token, int kind, out int value, int size, out int needed);
            [DllImport("kernel32.dll")] static extern bool CloseHandle(IntPtr handle);
            public static bool IsElevated(int pid) {
              IntPtr process = OpenProcess(0x1000, false, pid), token = IntPtr.Zero;
              if (process == IntPtr.Zero) throw new Win32Exception(Marshal.GetLastWin32Error());
              try {
                if (!OpenProcessToken(process, 8, out token)) throw new Win32Exception(Marshal.GetLastWin32Error());
                int elevated, needed;
                if (!GetTokenInformation(token, 20, out elevated, 4, out needed)) throw new Win32Exception(Marshal.GetLastWin32Error());
                return elevated != 0;
              } finally { if (token != IntPtr.Zero) CloseHandle(token); CloseHandle(process); }
            }
          }
          '@
            $env:TEMP = $tempRoot
            $env:TMP = $tempRoot
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $portable
            $start.UseShellExecute = $false
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $report.launchMethod = 'CurrentRunnerToken_NoElevationRequest'
            $launcher = [Diagnostics.Process]::Start($start)
            $mainProcess = $null
            while ($clock.Elapsed.TotalSeconds -lt 10) {
              $owned = @(Get-CimInstance Win32_Process -Filter "Name = 'TikirPC.exe'" | Where-Object {
                $_.ExecutablePath -and $_.ExecutablePath.StartsWith($workRoot, [StringComparison]::OrdinalIgnoreCase)
              })
              foreach ($candidate in $owned) {
                $process = Get-Process -Id $candidate.ProcessId -ErrorAction SilentlyContinue
                if ($process -and $process.MainWindowHandle -ne 0 -and $process.MainWindowTitle -match 'Tıkır PC') {
                  $mainProcess = $process
                  break
                }
              }
              if ($mainProcess) { break }
              Start-Sleep -Milliseconds 250
            }
            if (-not $mainProcess) { throw 'No owned TikirPC.exe main window appeared within 10 seconds. The hosted desktop may be unavailable or startup may have failed.' }
            $report.mainWindow = [ordered]@{ pid = $mainProcess.Id; title = $mainProcess.MainWindowTitle; elapsedSeconds = $clock.Elapsed.TotalSeconds }
            $report.startupPassed = $true
            try {
              $report.tokenElevated = [SmokeToken]::IsElevated($mainProcess.Id)
              $report.nonAdminVerified = -not $report.tokenElevated
            } catch {
              $report.tokenCheckError = $_.Exception.Message
            }
            $mainProcess.Refresh()
            if ($mainProcess.HasExited) { throw 'Application exited immediately after window discovery.' }
            # Use only a packaged read-only helper; do not invoke diagnose(),
            # run(), approveAndRun(), or any API-backed path.
            $diagnosticStart = [Diagnostics.ProcessStartInfo]::new()
            $diagnosticStart.FileName = $mainProcess.Path
            $diagnosticStart.UseShellExecute = $false
            $diagnosticStart.RedirectStandardOutput = $true
            $diagnosticStart.RedirectStandardError = $true
            $diagnosticStart.Environment['ELECTRON_RUN_AS_NODE'] = '1'
            $diagnosticStart.Environment['TIKIR_SMOKE_ASAR'] = Join-Path (Split-Path $mainProcess.Path) 'resources\app.asar'
            $diagnosticStart.ArgumentList.Add('-e')
            $diagnosticStart.ArgumentList.Add("const {WindowsRunner}=require(process.env.TIKIR_SMOKE_ASAR+'/src/core/runner.cjs'); new WindowsRunner().audioDiagnostic().then(result=>console.log(JSON.stringify(result))).catch(error=>{console.error(error.message);process.exitCode=1})")
            $report.readOnlyAudioQuery = [ordered]@{ attempted = $true; passed = $false }
            try {
              $diagnostic = [Diagnostics.Process]::Start($diagnosticStart)
              $diagnosticOutput = $diagnostic.StandardOutput.ReadToEndAsync()
              $diagnosticError = $diagnostic.StandardError.ReadToEndAsync()
              if (-not $diagnostic.WaitForExit(12000)) {
                $diagnostic.Kill()
                throw 'Read-only query exceeded 12 seconds.'
              }
              $report.readOnlyAudioQuery.exitCode = $diagnostic.ExitCode
              if ($diagnostic.ExitCode -ne 0) { throw $diagnosticError.Result.Substring(0, [Math]::Min(300, $diagnosticError.Result.Length)) }
              $result = $diagnosticOutput.Result.Trim() | ConvertFrom-Json
              $report.readOnlyAudioQuery.result = $result
              $report.readOnlyAudioQuery.passed = $result.id -eq 'audio' -and $result.status -in @('info','attention')
            } catch {
              $report.readOnlyAudioQuery.error = $_.Exception.Message
            }
            $report.passed = $true
          } catch {
            $report.error = $_.Exception.Message
            throw
          } finally {
            if ($launcher) {
              $report.launcherExited = $launcher.HasExited
              if ($launcher.HasExited) {
                $report.launcherExitCode = $launcher.ExitCode
              }
              if ($launchOutput -and $launchOutput.IsCompleted) { $report.launcherOutput = $launchOutput.Result }
              if ($launchError -and $launchError.IsCompleted) { $report.launcherError = $launchError.Result }
            }
            $report.observedAppProcesses = @(Get-CimInstance Win32_Process -Filter "Name = 'TikirPC.exe'" | Select-Object ProcessId, ParentProcessId, ExecutablePath)
            $report.extractedFiles = @(Get-ChildItem -Path $tempRoot -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 12 -ExpandProperty Name)
            # Stop only processes launched from this run's unique directory.
            $owned = @(Get-CimInstance Win32_Process | Where-Object {
              $_.ExecutablePath -and $_.ExecutablePath.StartsWith($workRoot, [StringComparison]::OrdinalIgnoreCase)
            })
            foreach ($process in $owned) { Stop-Process -Id $process.ProcessId -Force -ErrorAction SilentlyContinue }
            if ($launcher -and -not $launcher.HasExited) { $launcher.Kill() }
            $env:TEMP = $previousTemp
            $env:TMP = $previousTmp
            $report.completedUtc = [DateTime]::UtcNow.ToString('o')
            $report | ConvertTo-Json -Depth 6 | Set-Content -Path $reportPath -Encoding utf8
            Get-Content -Path $reportPath
          }

      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tikir-windows-smoke
          path: ${{ runner.temp }}/tikir-windows-smoke.json
          retention-days: 7
          if-no-files-found: error
